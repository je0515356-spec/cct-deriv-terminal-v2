<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091322"/>
      <stop offset="50%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00f2fe" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Glowing Crown Icon -->
  <g filter="url(#glow)" transform="translate(64, 80)">
    <!-- Crown Main Body -->
    <path d="M 40 280 L 70 80 L 160 200 L 192 40 L 224 200 L 314 80 L 344 280 Z" 
          fill="url(#crownGrad)" stroke="#38bdf8" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Crown Base Band -->
    <rect x="36" y="280" width="312" height="36" rx="10" fill="url(#crownGrad)" stroke="#38bdf8" stroke-width="4"/>
    
    <!-- Jewels / Gold Accents -->
    <circle cx="192" cy="40" r="14" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="70" cy="80" r="12" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="314" cy="80" r="12" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Base Jewels -->
    <circle cx="90" cy="298" r="8" fill="#ffffff"/>
    <circle cx="192" cy="298" r="10" fill="url(#goldGrad)"/>
    <circle cx="294" cy="298" r="8" fill="#ffffff"/>
  </g>

  <!-- Typography CCT -->
  <text x="256" y="430" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#ffffff" 
        text-anchor="middle">
    CCT
  </text>
  <text x="256" y="465" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#00f2fe" 
        text-anchor="middle">
    CROWN COME TRADER
  </text>
</svg>
